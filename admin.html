<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>學員管理後台 | 玩美學</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
  </head>
  <body>
    <main id="login-view" class="login-shell">
      <section class="login-art">
        <img src="assets/logo-icon.jpg" alt="玩美學">
        <p>BEING PERFECT · STUDIO DESK</p>
        <h1>把每一位老師的<br><em>學習旅程</em>放在眼前。</h1>
        <div class="login-stamp">內部管理專用</div>
      </section>
      <section class="login-card">
        <span class="section-no">00 / SIGN IN</span>
        <h2>管理者登入</h2>
        <p>輸入管理 Email，我們會寄送一次性登入連結。不需要密碼。</p>
        <form id="login-form">
          <label>Email<input id="admin-email" type="email" autocomplete="email" required placeholder="name@example.com"></label>
          <button type="submit">寄送安全登入連結 <span>→</span></button>
        </form>
        <p id="login-status" class="form-status" role="status"></p>
        <small>此頁不開放一般學員使用。</small>
      </section>
    </main>

    <div id="dashboard-view" class="dashboard" hidden>
      <header class="admin-header">
        <a href="index.html" class="admin-brand"><img src="assets/logo-icon.jpg" alt=""><span><b>玩美學</b><small>學員管理編輯台</small></span></a>
        <div class="header-actions"><span id="last-updated"></span><button id="refresh-button">重新整理</button><button id="logout-button" class="quiet">登出</button></div>
      </header>
      <section class="dashboard-intro">
        <div><p class="kicker">Teacher Program / Operations</p><h1>教師專班<br><em>學員總覽</em></h1></div>
        <p>付款、寄信、選課與課前資料集中在同一個畫面。點選學員即可查看完整內容。</p>
      </section>
      <section class="metrics" aria-label="統計摘要">
        <article><span>總報名</span><strong id="metric-total">—</strong><small>所有訂單</small></article>
        <article class="sun"><span>已付款</span><strong id="metric-paid">—</strong><small>含分期付款</small></article>
        <article class="mint"><span>課前資料完成</span><strong id="metric-intake">—</strong><small>可供講師查看</small></article>
        <article class="coral"><span>待處理</span><strong id="metric-action">—</strong><small>付款或寄信異常</small></article>
      </section>
      <section class="workbench">
        <div class="toolbar">
          <label class="search-box"><span>搜尋</span><input id="search-input" type="search" placeholder="姓名、Email、訂單編號"></label>
          <label><span>梯次</span><select id="cohort-filter"><option value="">全部梯次</option></select></label>
          <label><span>狀態</span><select id="status-filter"><option value="">全部狀態</option><option value="paid">已付款</option><option value="pending">待付款</option><option value="action">需處理</option><option value="complete">課前資料完成</option></select></label>
          <button id="export-button" class="export">匯出目前名單 ↗</button>
        </div>
        <div id="loading-state" class="loading-state"><span></span><p>正在整理學員資料…</p></div>
        <div id="empty-state" class="empty-state" hidden>目前沒有符合條件的學員。</div>
        <div class="table-wrap">
          <table id="students-table" hidden>
            <thead><tr><th>學員</th><th>梯次／選課</th><th>付款</th><th>課前資料</th><th>寄信</th><th></th></tr></thead>
            <tbody id="students-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <dialog id="student-dialog">
      <button class="dialog-close" aria-label="關閉">×</button>
      <div id="student-detail"></div>
    </dialog>
    <script src="config.js"></script><script type="module" src="admin.js"></script>
  </body>
</html>
